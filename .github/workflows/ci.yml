name: Test and Build

on:
  push:
    branches: ['sunub']
  pull_request:
    branches: ['sunub']

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      HOME: ${{ github.workspace }}/.ci-home
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare writable pnpm home
        run: |
          mkdir -p "${HOME}"
          mkdir -p "${HOME}/.pnpm-store"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Configure pnpm for CI
        run: |
          cat > "${HOME}/.npmrc" <<EOF
          store-dir=${HOME}/.pnpm-store
          fetch-retries=5
          fetch-retry-factor=2
          fetch-retry-mintimeout=10000
          fetch-retry-maxtimeout=120000
          fetch-timeout=120000
          child-concurrency=4
          manage-package-manager-versions=false
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm runtime
        run: |
          which pnpm
          pnpm --version
          pnpm config get manage-package-manager-versions
          pnpm config get store-dir

      - name: Install dependencies
        run: |
          set -euo pipefail
          PNPM_BIN="$(command -v pnpm)"

          for attempt in 1 2 3; do
            echo "pnpm install attempt ${attempt}/3"
            if "${PNPM_BIN}" install --frozen-lockfile --prefer-offline --network-concurrency 8; then
              exit 0
            fi

            echo "Install failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done

          echo "pnpm install failed after 3 attempts"
          exit 1

      - name: Run build
        run: pnpm build

      - name: Run lint
        run: pnpm lint
