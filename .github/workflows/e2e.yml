name: E2E Tests

on:
  push:
    branches: ["sunub"]
    paths:
      - "frontend/**"
      - "backend/**"
      - "packages/contracts/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "posts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: ["sunub"]
    paths:
      - "frontend/**"
      - "backend/**"
      - "packages/contracts/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "posts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"

jobs:
  e2e-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      HOME: ${{ github.workspace }}/.ci-home

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare writable pnpm home
        run: mkdir -p "${HOME}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --network-concurrency 10

      - name: Build utilities
        run: pnpm build:utils

      - name: Lint check
        run: |
          pnpm lint:frontend
          pnpm lint:utils

      - name: Type check
        working-directory: frontend
        run: pnpm run lint

      - name: Build frontend for E2E
        run: pnpm --filter frontend run build

      - name: Build backend for E2E
        run: pnpm --filter backend run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run backend unit tests
        run: pnpm run test:be:unit

      - name: Run frontend unit tests
        run: pnpm run test:fe:unit

      - name: Run frontend e2e tests
        run: pnpm run test:fe:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 30
