name: E2E Tests

on:
  push:
    branches: ["sunub"]
    paths:
      - "frontend/**"
      - "backend/**"
      - "packages/contracts/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "posts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: ["sunub"]
    paths:
      - "frontend/**"
      - "backend/**"
      - "packages/contracts/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "posts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"

jobs:
  e2e-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      HOME: ${{ github.workspace }}/.ci-home
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare writable pnpm home
        run: |
          mkdir -p "${HOME}"
          mkdir -p "${HOME}/.pnpm-store"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Configure pnpm for CI
        run: |
          pnpm config set store-dir "${HOME}/.pnpm-store"
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-factor 2
          pnpm config set fetch-retry-mintimeout 10000
          pnpm config set fetch-retry-maxtimeout 120000
          pnpm config set fetch-timeout 120000
          pnpm config set child-concurrency 4

      - name: Setup Node.js and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pnpm runtime
        run: |
          which pnpm
          pnpm --version

      - name: Install dependencies
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "pnpm install attempt ${attempt}/3"
            if pnpm install --frozen-lockfile --prefer-offline --network-concurrency 8; then
              exit 0
            fi

            echo "Install failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 10))
          done

          echo "pnpm install failed after 3 attempts"
          exit 1

      - name: Build utilities
        run: pnpm build:utils

      - name: Lint check
        run: |
          pnpm lint:frontend
          pnpm lint:utils

      - name: Type check
        working-directory: frontend
        run: pnpm run lint

      - name: Build frontend for E2E
        run: pnpm --filter frontend run build

      - name: Build backend for E2E
        run: pnpm --filter backend run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run backend unit tests
        run: pnpm run test:be:unit

      - name: Run frontend unit tests
        run: pnpm run test:fe:unit

      - name: Run frontend e2e tests
        run: pnpm run test:fe:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 30
